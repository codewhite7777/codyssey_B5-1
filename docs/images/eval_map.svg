<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330" font-family="-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" role="img" xml:space="preserve" style="white-space:pre"><title>평가 항목 한눈에 보기</title><rect width="760" height="330" fill="#FFFFFF" rx="12"/><rect x="20" y="20" width="170" height="290" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/><text x="105" y="44" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="700" fill="#3C3489">항목 1</text><text x="105" y="68" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#3C3489">결과물이 동작하는가</text><line x1="36" y1="86" x2="174" y2="86" stroke="#534AB7" stroke-width="0.6"/><text x="36" y="108" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#3C3489">• String 명령어 6개</text><text x="36" y="134" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#3C3489">• LRU 자동 제거</text><text x="36" y="160" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#3C3489">• INFO memory</text><text x="36" y="186" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#3C3489">• EXPIRE / TTL</text><text x="36" y="212" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#3C3489">• 에러 4종</text><rect x="36" y="262" width="138" height="32" rx="16" fill="#FFFFFF" stroke="#534AB7" stroke-width="0.6"/><text x="105" y="278" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#534AB7">시연 + 테스트</text><rect x="202" y="20" width="170" height="290" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/><text x="287" y="44" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="700" fill="#085041">항목 2</text><text x="287" y="68" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#085041">기본 자료구조 설명</text><line x1="218" y1="86" x2="356" y2="86" stroke="#0F6E56" stroke-width="0.6"/><text x="218" y="108" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#085041">• 이중 연결 리스트 O(1)</text><text x="218" y="134" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#085041">• 해시 함수 설계</text><text x="218" y="160" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#085041">• 체이닝</text><text x="218" y="186" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#085041">• 0.75 → 2배 확장</text><rect x="218" y="262" width="138" height="32" rx="16" fill="#FFFFFF" stroke="#0F6E56" stroke-width="0.6"/><text x="287" y="278" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#0F6E56">그림 + 코드</text><rect x="384" y="20" width="170" height="290" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.8"/><text x="469" y="44" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="700" fill="#633806">항목 3</text><text x="469" y="68" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#633806">조합해서 쓰는 원리</text><line x1="400" y1="86" x2="538" y2="86" stroke="#854F0B" stroke-width="0.6"/><text x="400" y="108" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#633806">• 해시맵 + 리스트 = LRU</text><text x="400" y="134" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#633806">• O(1) LRU 원리</text><text x="400" y="160" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#633806">• 힙 = TTL</text><text x="400" y="186" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#633806">• eviction 흐름</text><text x="400" y="212" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#633806">• GET 흐름</text><rect x="400" y="262" width="138" height="32" rx="16" fill="#FFFFFF" stroke="#854F0B" stroke-width="0.6"/><text x="469" y="278" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#854F0B">흐름도</text><rect x="566" y="20" width="170" height="290" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.8"/><text x="651" y="44" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="700" fill="#0C447C">항목 4</text><text x="651" y="68" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#0C447C">확장 질문</text><line x1="582" y1="86" x2="720" y2="86" stroke="#185FA5" stroke-width="0.6"/><text x="582" y="108" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#0C447C">• LRU → LFU</text><text x="582" y="134" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#0C447C">• 10만 건 병목</text><text x="582" y="160" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#0C447C">• 오버헤드 포함 모델</text><rect x="582" y="262" width="138" height="32" rx="16" fill="#FFFFFF" stroke="#185FA5" stroke-width="0.6"/><text x="651" y="278" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#185FA5">측정값 + 그림</text></svg>