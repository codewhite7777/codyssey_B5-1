<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420" font-family="-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" role="img" xml:space="preserve" style="white-space:pre"><title>체이닝: 같은 칸에 들어온 키는 리스트로 이어 붙인다</title><rect width="760" height="420" fill="#FFFFFF" rx="12"/><text x="30" y="28" text-anchor="start" dominant-baseline="central" font-size="15" font-weight="700" fill="#444441">버킷 배열 (칸 8개)</text><text x="200" y="28" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#888780">SET user:1 Alice → SET user:2 Bob → SET user:9 Ivy 를 한 뒤</text><rect x="30" y="52" width="70" height="34" rx="4" fill="#F1EFE8" stroke="#888780" stroke-width="0.8"/><text x="65" y="69" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#444441" font-family="'SF Mono', Menlo, Consolas, 'D2Coding', 'Noto Sans Mono CJK KR', monospace">[0]</text><text x="120" y="69" text-anchor="start" dominant-baseline="central" font-size="11" font-weight="400" fill="#888780">비어 있음 (None)</text><rect x="30" y="94" width="70" height="34" rx="4" fill="#F1EFE8" stroke="#888780" stroke-width="0.8"/><text x="65" y="111" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#444441" font-family="'SF Mono', Menlo, Consolas, 'D2Coding', 'Noto Sans Mono CJK KR', monospace">[1]</text><text x="120" y="111" text-anchor="start" dominant-baseline="central" font-size="11" font-weight="400" fill="#888780">비어 있음 (None)</text><rect x="30" y="136" width="70" height="34" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="1.2"/><text x="65" y="153" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#712B13" font-family="'SF Mono', Menlo, Consolas, 'D2Coding', 'Noto Sans Mono CJK KR', monospace">[2]</text><line x1="100" y1="153" x2="138" y2="153" stroke="#5F5E5A" stroke-width="1.3"/><path d="M129.6 15