="#085041" font-family="'SF Mono', Menlo, Consolas, 'D2Coding', 'Noto Sans Mono CJK KR', monospace">(user:2, Bob)</text><rect x="30" y="220" width="70" height="34" rx="4" fill="#F1EFE8" stroke="#888780" stroke-width="0.8"/><text x="65" y="237" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#444441" font-family="'SF Mono', Menlo, Consolas, 'D2Coding', 'Noto Sans Mono CJK KR', monospace">[4]</text><text x="120" y="237" text-anchor="start" dominant-baseline="central" font-size="11" font-weight="400" fill="#888780">비어 있음 (None)</text><rect x="30" y="262" width="70" height="34" rx="4" fill="#F1EFE8" stroke="#888780" stroke-width="0.8"/><text x="65" y="279" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#444441" font-family="'SF Mono', Menlo, Consolas, 'D2Coding', 'Noto Sans Mono CJK KR', monospace">[5]</text><text x="120" y="279" text-anchor="start" dominant-baseline="central" font-size="11" font-weight="400" fill="#888780">비어 있음 (None)</text><rect x="30" y="304" width="70" height="34" rx="4" fill="#F1EFE8" stroke="#888780" stroke-width="0.8"/><text x="65" y="321" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#444441" font-family="'SF Mono', Menlo, Consolas, 'D2Coding', 'Noto Sans Mono CJK KR', monospace">[6]</text><text x="120" y="321" text-anchor="start" dominant-baseline="central" font-size="11" font-weight="400" fill="#888780">비어 있음 (None)</text><rect x="30" y="346" width="70" height="34" rx="4" fill="#F1EFE8" stroke="#888780" stroke-width="0.8"/><text x="65" y="363" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#444441" font-family="'SF Mono', Menlo, Consolas, 'D2Coding', 'Noto Sans Mono CJK KR', monospace">[7]</text><text x="120" y="363" text-anchor="start" dominant-baseline="central" font-size="11" font-weight="400" fill="#888780">비어 있음 (None)</text><rect x="500" y="60" width="240" height="120" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/><text x="620" y="82" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="700" fill="#712B13">충돌!</text><text x="620" y="106" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#712B13" font-family="'SF Mono', Menlo, Consolas, 'D2Coding', 'Noto Sans Mono CJK KR', monospace">user:1 → 해시 % 8 = 2</text><text x="620" y="126" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#712B13" font-family="'SF Mono', Menlo, Consolas, 'D2Coding', 'Noto Sans Mono CJK KR', monospace">user:9 → 해시 % 8 = 2</text><text x="620" y="152" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#712B13">같은 칸 → 리스트 뒤에 이어 붙임</text><rect x="500" y="200" width="240" height="176" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.8"/><text x="620" y="222" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="700" fill="#0C447C">GET user:9 찾는 법</text><text x="516" y="250" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#0C447C">1. 해시 % 8 = 2 → 2번 칸으로 바로</text><text x="516" y="274" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#0C447C">2. 칸 안의 리스트를 앞에서부터</text><text x="530" y="294" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#0C447C">키를 비교: user:1 아님 → user:9 찾음</text><text x="516" y="322" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="600" fill="#0C447C">체인은 보통 0~1개 → 평균 O(1)</text><text x="516" y="346" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#185FA5">버킷 = 고정 길이 배열</text><text x="516" y="364" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#185FA5">체인 = 이중 연결 리스트 재사용</text></svg>