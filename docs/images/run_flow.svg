<svg xmlns="http://www.w3.org/2000/svg" width="680" height="616" viewBox="0 0 680 616" font-family="-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" role="img" xml:space="preserve" style="white-space:pre"><title>실행과 확인 흐름</title><rect width="680" height="616" fill="#FFFFFF" rx="12"/><rect x="40" y="20" width="600" height="54" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.8"/><text x="340.0" y="37.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#444441">1. 레포 받기</text><text x="340.0" y="58.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#888780">git clone → cd codyssey_b5-1</text><line x1="340" y1="74" x2="340" y2="90" stroke="#5F5E5A" stroke-width="1.3"/><path d="M334.0 81.6 L340.0 90.0 L346.0 81.6" fill="none" stroke="#5F5E5A" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round"/><rect x="40" y="92" width="600" height="54" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.8"/><text x="340.0" y="109.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#444441">2. 테스트 실행</text><text x="340.0" y="130.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#888780">python3 -m unittest -v → 27개 OK</text><line x1="340" y1="146" x2="340" y2="162" stroke="#5F5E5A" stroke-width="1.3"/><path d="M334.0 153.6 L340.0 162.0 L346.0 153.6" fill="none" stroke="#5F5E5A" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round"/><rect x="40" y="164" width="600" height="54" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/><text x="340.0" y="181.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#3C3489">3. 프로그램 실행</text><text x="340.0" y="202.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#534AB7">python3 main.py → mini-redis&gt; 프롬프트</text><line x1="340" y1="218" x2="340" y2="234" stroke="#5F5E5A" stroke-width="1.3"/><path d="M334.0 225.6 L340.0 234.0 L346.0 225.6" fill="none" stroke="#5F5E5A" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round"/><rect x="40" y="236" width="600" height="54" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/><text x="340.0" y="253.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#3C3489">4. String 명령어</text><text x="340.0" y="274.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#534AB7">SET · GET · DEL · EXISTS · DBSIZE · KEYS</text><line x1="340" y1="290" x2="340" y2="306" stroke="#5F5E5A" stroke-width="1.3"/><path d="M334.0 297.6 L340.0 306.0 L346.0 297.6" fill="none" stroke="#5F5E5A" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round"/><rect x="40" y="308" width="600" height="54" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.8"/><text x="340.0" y="325.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#633806">5. 메모리 제한과 LRU 제거</text><text x="340.0" y="346.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#854F0B">CONFIG SET maxmemory 30 → SET 3번 → INFO memory</text><line x1="340" y1="362" x2="340" y2="378" stroke="#5F5E5A" stroke-width="1.3"/><path d="M334.0 369.6 L340.0 378.0 L346.0 369.6" fill="none" stroke="#5F5E5A" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round"/><rect x="40" y="380" width="600" height="54" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.8"/><text x="340.0" y="397.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#0C447C">6. TTL</text><text x="340.0" y="418.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#185FA5">EXPIRE → TTL → 3초 기다리기 → GET, TTL</text><line x1="340" y1="434" x2="340" y2="450" stroke="#5F5E5A" stroke-width="1.3"/><path d="M334.0 441.6 L340.0 450.0 L346.0 441.6" fill="none" stroke="#5F5E5A" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round"/><rect x="40" y="452" width="600" height="54" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/><text x="340.0" y="469.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#712B13">7. 에러 처리</text><text x="340.0" y="490.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#993C1D">없는 명령 · 인자 개수 · 정수 아님 · OOM</text><line x1="340" y1="506" x2="340" y2="522" stroke="#5F5E5A" stroke-width="1.3"/><path d="M334.0 513.6 L340.0 522.0 L346.0 513.6" fill="none" stroke="#5F5E5A" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round"/><rect x="40" y="524" width="600" height="54" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.8"/><text x="340.0" y="541.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#444441">8. 종료</text><text x="340.0" y="562.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#888780">exit 또는 quit</text></svg>