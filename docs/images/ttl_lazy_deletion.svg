<svg xmlns="http://www.w3.org/2000/svg" width="760" height="520" viewBox="0 0 760 520" font-family="-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" role="img" xml:space="preserve" style="white-space:pre"><title>TTL: 힙 정리와 lazy deletion</title><rect width="760" height="520" fill="#FFFFFF" rx="12"/><text x="30" y="28" text-anchor="start" dominant-baseline="central" font-size="14" font-weight="700" fill="#444441">명령어마다 먼저 힙 맨 위부터 '시간이 지난 것'만 꺼내서 확인한다</text><rect x="30" y="56" width="200" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.8"/><text x="130.0" y="74.0" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#0C447C">힙 맨 위 보기 (peek)</text><text x="130.0" y="95.0" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="400" fill="#185FA5">가장 빠른 만료</text><line x1="230" y1="84" x2="268" y2="84" stroke="#5F5E5A" stroke-width="1.3"/><path d="M259.6 90.0 L268.0 84.0 L259.6 78.0" fill="none" stroke="#5F5E5A" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round"/><path d="M360 46.0 L450.0 84 L360 122.0 L270.0 84 Z" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.8"/><text x="360" y="76.5" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#633806">시각이</text><text x="360" y="91.5" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#633806">지났나?</text><line x1="450" y1="84" x2="498" y2="84" stroke="#5F5E5A" stroke-width="1.3"/><path d="M489.6 90.0 L498.0 84.0 L489.6 78.0" fill="none" stroke="#5F5E5A" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round"/><text x="474" y="72" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="400" fill="#888780">아니오</text><rect x="500" y="56" width="230" height="56" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.8"/><text x="615.0" y="74.0" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#444441">멈춤</text><text x="615.0" y="95.0" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="400" fill="#888780">나머지는 더 늦게 만료 → 볼 필요 없음</text><line x1="360" y1="122" x2="360" y2="156" stroke="#5F5E5A" stroke-width="1.3"/><path d="M354.0 147.6 L360.0 156.0 L366.0 147.6" fill="none" stroke="#5F5E5A" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round"/><text x="372" y="138" text-anchor="start" dominant-baseline="central" font-size="11" font-weight="400" fill="#888780">예 → pop</text><path d="M360 156.0 L490.0 196 L360 236.0 L230.0 196 Z" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.8"/><text x="360" y="188.5" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#633806">Record의 expire_at과</text><text x="360" y="203.5" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#633806">같은가?</text><line x1="230" y1="196" x2="160" y2="196" stroke="#5F5E5A" stroke-width="1.3"/><path d="M168.4 190.0 L160.0 196.0 L168.4 202.0" fill="none" stroke="#5F5E5A" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round"/><text x="196" y="184" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="400" fill="#888780">예</text><rect x="30" y="168" width="130" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/><text x="95.0" y="186.0" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#712B13">키 삭제</text><text x="95.0" y="207.0" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="400" fill="#993C1D">진짜 만료</text><line x1="490" y1="196" x2="538" y2="196" stroke="#5F5E5A" stroke-width="1.3"/><path d="M529.6 202.0 L538.0 196.0 L529.6 190.0" fill="none" stroke="#5F5E5A" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round"/><text x="514" y="184" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="400" fill="#888780">아니오</text><rect x="540" y="168" width="190" height="56" rx="8" fill="#FFFFFF" stroke="#888780" stroke-width="0.8"/><text x="635.0" y="186.0" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#444441">그냥 버림</text><text x="635.0" y="207.0" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="400" fill="#888780">낡은 항목 (아래 표)</text><line x1="95" y1="168" x2="95" y2="114" stroke="#5F5E5A" stroke-width="1.3"/><path d="M101.0 122.4 L95.0 114.0 L89.0 122.4" fill="none" stroke="#5F5E5A" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round"/><text x="105" y="140" text-anchor="start" dominant-baseline="central" font-size="11" font-weight="400" fill="#888780">삭제하든 버리든 다시 맨 위 보기 (반복)</text><text x="30" y="262" text-anchor="start" dominant-baseline="central" font-size="13" font-weight="600" fill="#444441">낡은 항목이 생기는 경우 — 힙 가운데 항목은 바로 찾을 수 없어서(O(n)) 그 자리에서 지우지 않는다</text><rect x="30" y="282" width="700" height="28" rx="4" fill="#F1EFE8" stroke="#888780" stroke-width="0.6"/><text x="150" y="296" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#444441">명령</text><text x="360" y="296" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#444441">Record.expire_at</text><text x="590" y="296" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#444441">힙에 남은 항목</text><text x="150" y="325" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#444441" font-family="'SF Mono', Menlo, Consolas, 'D2Coding', 'Noto Sans Mono CJK KR', monospace">EXPIRE a 5</text><text x="360" y="325" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#185FA5">지금+5</text><text x="590" y="325" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#085041">(지금+5, a)  유효</text><text x="150" y="355" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#444441" font-family="'SF Mono', Menlo, Consolas, 'D2Coding', 'Noto Sans Mono CJK KR', monospace">SET a 2  (덮어쓰기)</text><text x="360" y="355" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#185FA5">None  (TTL 초기화)</text><text x="590" y="355" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#993C1D">(지금+5, a)  낡음 → 꺼낼 때 버림</text><text x="150" y="385" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#444441" font-family="'SF Mono', Menlo, Consolas, 'D2Coding', 'Noto Sans Mono CJK KR', monospace">EXPIRE a 100</text><text x="360" y="385" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#185FA5">지금+100</text><text x="590" y="385" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#993C1D">(지금+5, a) 낡음,  (지금+100, a) 유효</text><text x="150" y="415" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#444441" font-family="'SF Mono', Menlo, Consolas, 'D2Coding', 'Noto Sans Mono CJK KR', monospace">DEL a</text><text x="360" y="415" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#185FA5">Record 자체가 없음</text><text x="590" y="415" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#993C1D">남은 항목 모두 낡음 → 꺼낼 때 버림</text><rect x="30" y="446" width="700" height="72" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.8"/><text x="50" y="466" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="700" fill="#0C447C">'만료 여부의 정답'은 Record.expire_at 하나뿐이다.</text><text x="50" y="488" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#0C447C">힙은 '언제 확인하러 가면 되는지' 알려주는 알림 목록이다. 그래서 DEL은 해시맵(+expire_at)과</text><text x="50" y="506" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#0C447C">LRU 리스트에서 바로 지우고, 힙에 남은 알림은 나중에 꺼낼 때 비교해서 버린다.</text></svg>