<svg xmlns="http://www.w3.org/2000/svg" width="760" height="560" viewBox="0 0 760 560" font-family="-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" role="img" xml:space="preserve" style="white-space:pre"><title>used_memory에 오버헤드를 포함하면</title><rect width="760" height="560" fill="#FFFFFF" rx="12"/><text x="30" y="28" text-anchor="start" dominant-baseline="central" font-size="14" font-weight="700" fill="#444441">같은 10만 건인데, 무엇을 세느냐에 따라 숫자가 약 50배 달라진다</text><text x="190" y="74" text-anchor="end" dominant-baseline="central" font-size="12" font-weight="600" fill="#444441">지금 공식</text><text x="190" y="92" text-anchor="end" dominant-baseline="central" font-size="11" font-weight="400" fill="#888780">키 + 값 바이트</text><rect x="200" y="66" width="10" height="30" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/><text x="218" y="81" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="600" fill="#085041">1,977,780 B  (≈ 1.9 MB)</text><text x="190" y="128" text-anchor="end" dominant-baseline="central" font-size="12" font-weight="600" fill="#444441">실제 파이썬 메모리</text><text x="190" y="146" text-anchor="end" dominant-baseline="central" font-size="11" font-weight="400" fill="#888780">tracemalloc 측정</text><rect x="200" y="120" width="530" height="30" rx="3" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/><text x="720" y="135" text-anchor="end" dominant-baseline="central" font-size="12" font-weight="600" fill="#712B13">104,682,380 B  (≈ 100 MB, 약 53배)</text><text x="30" y="176" text-anchor="start" dominant-baseline="central" font-size="13" font-weight="600" fill="#444441">키 하나를 저장할 때 실제로 생기는 것들</text><rect x="30" y="196" width="86.88" height="32" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/><text x="73.44" y="212" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#085041">key 문자열</text><rect x="124.88" y="196" width="97.19999999999999" height="32" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/><text x="173.48" y="212" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#085041">value 문자열</text><rect x="230.07999999999998" y="196" width="96.47999999999999" height="32" rx="6" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/><text x="278.32" y="212" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#712B13">Record 객체</text><rect x="334.55999999999995" y="196" width="83.52" height="32" rx="6" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/><text x="376.31999999999994" y="212" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#712B13">LRU Node</text><rect x="426.0799999999999" y="196" width="89.75999999999999" height="32" rx="6" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/><text x="470.9599999999999" y="212" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#712B13">Entry 객체</text><rect x="523.8399999999999" y="196" width="83.03999999999999" height="32" rx="6" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/><text x="565.3599999999999" y="212" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#712B13">체인 Node</text><rect x="30" y="238" width="148.32" height="32" rx="6" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/><text x="104.16" y="254" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#712B13">버킷 칸 (빈 칸 포함)</text><rect x="186.32" y="238" width="130.07999999999998" height="32" rx="6" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/><text x="251.35999999999999" y="254" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#712B13">힙 튜플 (TTL 시)</text><text x="30" y="290" text-anchor="start" dominant-baseline="central" font-size="11" font-weight="400" fill="#888780">초록 = 지금 공식이 세는 것      빨강 = 오버헤드 (지금은 0으로 침)</text><rect x="30" y="318" width="340" height="190" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.8"/><text x="46" y="340" text-anchor="start" dominant-baseline="central" font-size="13" font-weight="700" fill="#633806">무엇이 달라지나</text><text x="46" y="368" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#633806">• 같은 maxmemory에서 훨씬 일찍 제거됨</text><text x="46" y="394" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#633806">• 짧은 키가 많을수록 손해 (고정 비용)</text><text x="46" y="420" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#633806">• 체인·확장 때문에 크기가 계단처럼 변함</text><text x="46" y="446" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#633806">• 빈 키+값이어도 0바이트가 아님</text><text x="46" y="472" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#633806">• OOM 판단 기준(엔트리 1개 크기)도 바뀜</text><rect x="390" y="318" width="340" height="190" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.8"/><text x="406" y="340" text-anchor="start" dominant-baseline="central" font-size="13" font-weight="700" fill="#0C447C">공정한 비교/채점을 위한 보정</text><text x="406" y="368" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#0C447C">• 키 하나당 고정 비용을 약속해서 더함</text><text x="406" y="390" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#0C447C">   (예: 키 + 값 + 64바이트)</text><text x="406" y="412" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#0C447C">• 언어·버전마다 객체 크기가 다르므로</text><text x="406" y="434" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#0C447C">   측정값 대신 '약속한 공식'으로 채점</text><text x="406" y="456" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#0C447C">• 두 숫자(데이터 / 전체)를 따로 보고</text><text x="406" y="478" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#0C447C">• 같은 데이터·같은 순서로 비교</text></svg>