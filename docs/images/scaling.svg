<svg xmlns="http://www.w3.org/2000/svg" width="760" height="640" viewBox="0 0 760 640" font-family="-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" role="img" xml:space="preserve" style="white-space:pre"><title>10만 건에서 병목</title><rect width="760" height="640" fill="#FFFFFF" rx="12"/><text x="30" y="28" text-anchor="start" dominant-baseline="central" font-size="14" font-weight="700" fill="#444441">10만 건 SET 실측: 평소 1건 ≈ 0.02ms, 그런데 가끔 한 번씩 크게 튄다</text><rect x="440" y="48" width="14" height="14" rx="3" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/><text x="460" y="55" text-anchor="start" dominant-baseline="central" font-size="11" font-weight="400" fill="#444441">보통 실행 (GC 켬)</text><rect x="590" y="48" width="14" height="14" rx="3" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.8"/><text x="610" y="55" text-anchor="start" dominant-baseline="central" font-size="11" font-weight="400" fill="#444441">GC 끄고 다시 측정</text><line x1="90" y1="294" x2="710" y2="294" stroke="#B4B2A9" stroke-width="1"/><line x1="90" y1="294.0" x2="710" y2="294.0" stroke="#EEEDE8" stroke-width="0.8"/><text x="82" y="294.0" text-anchor="end" dominant-baseline="central" font-size="10" font-weight="400" fill="#888780">0ms</text><line x1="90" y1="241.5" x2="710" y2="241.5" stroke="#EEEDE8" stroke-width="0.8"/><text x="82" y="241.5" text-anchor="end" dominant-baseline="central" font-size="10" font-weight="400" fill="#888780">200ms</text><line x1="90" y1="189.0" x2="710" y2="189.0" stroke="#EEEDE8" stroke-width="0.8"/><text x="82" y="189.0" text-anchor="end" dominant-baseline="central" font-size="10" font-weight="400" fill="#888780">400ms</text><line x1="90" y1="136.5" x2="710" y2="136.5" stroke="#EEEDE8" stroke-width="0.8"/><text x="82" y="136.5" text-anchor="end" dominant-baseline="central" font-size="10" font-weight="400" fill="#888780">600ms</text><line x1="90" y1="84.0" x2="710" y2="84.0" stroke="#EEEDE8" stroke-width="0.8"/><text x="82" y="84.0" text-anchor="end" dominant-baseline="central" font-size="10" font-weight="400" fill="#888780">800ms</text><rect x="101.51428571428572" y="292.95" width="30.999999999999996" height="1.05" rx="2" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/><text x="117.01428571428572" y="283.95" text-anchor="middle" dominant-baseline="central" font-size="9.5" font-weight="600" fill="#712B13">4</text><rect x="135.17142857142858" y="292.03125" width="30.999999999999996" height="1.96875" rx="2" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.8"/><text x="150.67142857142858" y="283.03125" text-anchor="middle" dominant-baseline="central" font-size="9.5" font-weight="600" fill="#0C447C">7.5</text><text x="134.28571428571428" y="308" text-anchor="middle" dominant-baseline="central" font-size="10" font-weight="400" fill="#444441">1,537번째</text><text x="134.28571428571428" y="324" text-anchor="middle" dominant-baseline="central" font-size="10" font-weight="400" fill="#888780">→ 4,096칸</text><rect x="190.08571428571426" y="291.45375" width="30.999999999999996" height="2.5462499999999997" rx="2" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/><text x="205.58571428571426" y="282.45375" text-anchor="middle" dominant-baseline="central" font-size="9.5" font-weight="600" fill="#712B13">9.7</text><rect x="223.74285714285713" y="289.98375" width="30.999999999999996" height="4.01625" rx="2" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.8"/><text x="239.24285714285713" y="280.98375" text-anchor="middle" dominant-baseline="central" font-size="9.5" font-weight="600" fill="#0C447C">15.3</text><text x="222.85714285714283" y="308" text-anchor="middle" dominant-baseline="central" font-size="10" font-weight="400" fill="#444441">3,073번째</text><text x="222.85714285714283" y="324" text-anchor="middle" dominant-baseline="central" font-size="10" font-weight="400" fill="#888780">→ 8,192칸</text><rect x="278.65714285714284" y="289.17" width="30.999999999999996" height="4.83" rx="2" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/><text x="294.15714285714284" y="280.17" text-anchor="middle" dominant-baseline="central" font-size="9.5" font-weight="600" fill="#712B13">18.4</text><rect x="312.3142857142857" y="286.23" width="30.999999999999996" height="7.770000000000001" rx="2" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.8"/><text x="327.8142857142857" y="277.23" text-anchor="middle" dominant-baseline="central" font-size="9.5" font-weight="600" fill="#0C447C">29.6</text><text x="311.42857142857144" y="308" text-anchor="middle" dominant-baseline="central" font-size="10" font-weight="400" fill="#444441">6,145번째</text><text x="311.42857142857144" y="324" text-anchor="middle" dominant-baseline="central" font-size="10" font-weight="400" fill="#888780">→ 16,384칸</text><rect x="367.22857142857146" y="283.605" width="30.999999999999996" height="10.395000000000001" rx="2" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/><text x="382.72857142857146" y="274.605" text-anchor="middle" dominant-baseline="central" font-size="9.5" font-weight="600" fill="#712B13">39.6</text><rect x="400.8857142857143" y="280.69125" width="30.999999999999996" height="13.30875" rx="2" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.8"/><text x="416.3857142857143" y="271.69125" text-anchor="middle" dominant-baseline="central" font-size="9.5" font-weight="600" fill="#0C447C">50.7</text><text x="400.0" y="308" text-anchor="middle" dominant-baseline="central" font-size="10" font-weight="400" fill="#444441">12,289번째</text><text x="400.0" y="324" text-anchor="middle" dominant-baseline="central" font-size="10" font-weight="400" fill="#888780">→ 32,768칸</text><rect x="455.8" y="260.05875" width="30.999999999999996" height="33.941250000000004" rx="2" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/><text x="471.3" y="251.05874999999997" text-anchor="middle" dominant-baseline="central" font-size="9.5" font-weight="600" fill="#712B13">129.3</text><rect x="489.45714285714286" y="278.145" width="30.999999999999996" height="15.854999999999999" rx="2" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.8"/><text x="504.95714285714286" y="269.145" text-anchor="middle" dominant-baseline="central" font-size="9.5" font-weight="600" fill="#0C447C">60.4</text><text x="488.57142857142856" y="308" text-anchor="middle" dominant-baseline="central" font-size="10" font-weight="400" fill="#444441">24,577번째</text><text x="488.57142857142856" y="324" text-anchor="middle" dominant-baseline="central" font-size="10" font-weight="400" fill="#888780">→ 65,536칸</text><rect x="544.3714285714286" y="240.42375" width="30.999999999999996" height="53.576249999999995" rx="2" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/><text x="559.8714285714286" y="231.42375" text-anchor="middle" dominant-baseline="central" font-size="9.5" font-weight="600" fill="#712B13">204.1</text><rect x="578.0285714285715" y="262.71" width="30.999999999999996" height="31.29" rx="2" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.8"/><text x="593.5285714285715" y="253.70999999999998" text-anchor="middle" dominant-baseline="central" font-size="9.5" font-weight="600" fill="#0C447C">119.2</text><text x="577.1428571428572" y="308" text-anchor="middle" dominant-baseline="central" font-size="10" font-weight="400" fill="#444441">49,153번째</text><text x="577.1428571428572" y="324" text-anchor="middle" dominant-baseline="central" font-size="10" font-weight="400" fill="#888780">→ 131,072칸</text><rect x="632.9428571428572" y="98.88374999999999" width="30.999999999999996" height="195.11625" rx="2" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/><text x="648.4428571428572" y="89.88374999999999" text-anchor="middle" dominant-baseline="central" font-size="9.5" font-weight="600" fill="#712B13">743.3</text><rect x="666.6" y="232.81125" width="30.999999999999996" height="61.18875" rx="2" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.8"/><text x="682.1" y="223.81125" text-anchor="middle" dominant-baseline="central" font-size="9.5" font-weight="600" fill="#0C447C">233.1</text><text x="665.7142857142858" y="308" text-anchor="middle" dominant-baseline="central" font-size="10" font-weight="400" fill="#444441">98,305번째</text><text x="665.7142857142858" y="324" text-anchor="middle" dominant-baseline="central" font-size="10" font-weight="400" fill="#888780">→ 262,144칸</text><text x="400.0" y="344" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="400" fill="#888780">해시맵 확장이 일어난 SET 한 번의 시간   * Python 3.13, 이 환경에서 측정 (숫자는 환경마다 다름)</text><rect x="30" y="378" width="700" height="66" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.8"/><text x="46" y="396" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="700" fill="#633806">읽는 법</text><text x="46" y="416" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#633806">• GC를 꺼도 확장은 키가 많을수록 오래 걸린다 (233ms) → 확장 자체가 O(n)</text><text x="46" y="434" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#633806">• 큰 확장 때는 파이썬 GC가 겹쳐 약 3배. 확장이 없는 72,053번째에서도 GC만으로 132ms 튐</text><rect x="30" y="458" width="700" height="28" rx="4" fill="#F1EFE8" stroke="#888780" stroke-width="0.6"/><text x="120" y="472" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#444441">병목</text><text x="340" y="472" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#444441">왜</text><text x="590" y="472" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#444441">개선</text><text x="120" y="500" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#444441">해시맵 확장</text><text x="340" y="500" text-anchor="middle" dominant-baseline="central" font-size="11.5" font-weight="400" fill="#993C1D">모든 키를 한 번에 다시 넣음 O(n)</text><text x="590" y="500" text-anchor="middle" dominant-baseline="central" font-size="11.5" font-weight="400" fill="#085041">조금씩 옮기기 (점진적 리해시)</text><text x="120" y="528" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#444441">파이썬 GC</text><text x="340" y="528" text-anchor="middle" dominant-baseline="central" font-size="11.5" font-weight="400" fill="#993C1D">prev ↔ next 순환 참조 객체가 많음</text><text x="590" y="528" text-anchor="middle" dominant-baseline="central" font-size="11.5" font-weight="400" fill="#085041">순환 줄이기, GC 기준 조정</text><text x="120" y="556" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#444441">KEYS</text><text x="340" y="556" text-anchor="middle" dominant-baseline="central" font-size="11.5" font-weight="400" fill="#993C1D">모든 칸을 훑음 (10만 건 ≈ 38ms)</text><text x="590" y="556" text-anchor="middle" dominant-baseline="central" font-size="11.5" font-weight="400" fill="#085041">SCAN처럼 나눠서 조회</text><text x="120" y="584" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#444441">TTL 힙의 낡은 항목</text><text x="340" y="584" text-anchor="middle" dominant-baseline="central" font-size="11.5" font-weight="400" fill="#993C1D">EXPIRE를 반복하면 힙만 커짐</text><text x="590" y="584" text-anchor="middle" dominant-baseline="central" font-size="11.5" font-weight="400" fill="#085041">낡은 비율이 크면 힙 다시 만들기</text><text x="120" y="612" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#444441">만료 확인 시점</text><text x="340" y="612" text-anchor="middle" dominant-baseline="central" font-size="11.5" font-weight="400" fill="#993C1D">명령이 올 때만 확인</text><text x="590" y="612" text-anchor="middle" dominant-baseline="central" font-size="11.5" font-weight="400" fill="#085041">주기적으로 일부 키 검사</text></svg>