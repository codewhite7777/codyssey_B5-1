<svg xmlns="http://www.w3.org/2000/svg" width="760" height="560" viewBox="0 0 760 560" font-family="-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" role="img" xml:space="preserve" style="white-space:pre"><title>10만 건에서 병목</title><rect width="760" height="560" fill="#FFFFFF" rx="12"/><text x="30" y="28" text-anchor="start" dominant-baseline="central" font-size="14" font-weight="700" fill="#444441">10만 건 SET 실측: 평소 1건 ≈ 0.02ms, 그런데 확장하는 순간만 크게 튄다</text><line x1="90" y1="280" x2="710" y2="280" stroke="#B4B2A9" stroke-width="1"/><line x1="90" y1="280.0" x2="710" y2="280.0" stroke="#EEEDE8" stroke-width="0.8"/><text x="82" y="280.0" text-anchor="end" dominant-baseline="central" font-size="10" font-weight="400" fill="#888780">0ms</text><line x1="90" y1="217.14285714285714" x2="710" y2="217.14285714285714" stroke="#EEEDE8" stroke-width="0.8"/><text x="82" y="217.14285714285714" text-anchor="end" dominant-baseline="central" font-size="10" font-weight="400" fill="#888780">200ms</text><line x1="90" y1="154.28571428571428" x2="710" y2="154.28571428571428" stroke="#EEEDE8" stroke-width="0.8"/><text x="82" y="154.28571428571428" text-anchor="end" dominant-baseline="central" font-size="10" font-weight="400" fill="#888780">400ms</text><line x1="90" y1="91.42857142857144" x2="710" y2="91.42857142857144" stroke="#EEEDE8" stroke-width="0.8"/><text x="82" y="91.42857142857144" text-anchor="end" dominant-baseline="central" font-size="10" font-weight="400" fill="#888780">600ms</text><rect x="107.71428571428572" y="277.14" width="53.14285714285714" height="2.86" rx="3" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.8"/><text x="134.28571428571428" y="267.14" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="600" fill="#0C447C">9.1</text><text x="134.28571428571428" y="294" text-anchor="middle" dominant-baseline="central" font-size="10" font-weight="400" fill="#444441">1,537번째</text><text x="134.28571428571428" y="310" text-anchor="middle" dominant-baseline="central" font-size="10" font-weight="400" fill="#888780">→ 4,096칸</text><rect x="196.28571428571428" y="275.09714285714284" width="53.14285714285714" height="4.902857142857142" rx="3" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.8"/><text x="222.85714285714283" y="265.09714285714284" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="600" fill="#0C447C">15.6</text><text x="222.85714285714283" y="294" text-anchor="middle" dominant-baseline="central" font-size="10" font-weight="400" fill="#444441">3,073번째</text><text x="222.85714285714283" y="310" text-anchor="middle" dominant-baseline="central" font-size="10" font-weight="400" fill="#888780">→ 8,192칸</text><rect x="284.85714285714283" y="274.8142857142857" width="53.14285714285714" height="5.185714285714286" rx="3" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.8"/><text x="311.4285714285714" y="264.8142857142857" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="600" fill="#0C447C">16.5</text><text x="311.4285714285714" y="294" text-anchor="middle" dominant-baseline="central" font-size="10" font-weight="400" fill="#444441">6,145번째</text><text x="311.4285714285714" y="310" text-anchor="middle" dominant-baseline="central" font-size="10" font-weight="400" fill="#888780">→ 16,384칸</text><rect x="373.42857142857144" y="267.52285714285716" width="53.14285714285714" height="12.477142857142859" rx="3" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.8"/><text x="400.0" y="257.52285714285716" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="600" fill="#0C447C">39.7</text><text x="400.0" y="294" text-anchor="middle" dominant-baseline="central" font-size="10" font-weight="400" fill="#444441">12,289번째</text><text x="400.0" y="310" text-anchor="middle" dominant-baseline="central" font-size="10" font-weight="400" fill="#888780">→ 32,768칸</text><rect x="462.0" y="242.12857142857143" width="53.14285714285714" height="37.871428571428574" rx="3" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/><text x="488.57142857142856" y="232.12857142857143" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="600" fill="#712B13">120.5</text><text x="488.57142857142856" y="294" text-anchor="middle" dominant-baseline="central" font-size="10" font-weight="400" fill="#444441">24,577번째</text><text x="488.57142857142856" y="310" text-anchor="middle" dominant-baseline="central" font-size="10" font-weight="400" fill="#888780">→ 65,536칸</text><rect x="550.5714285714286" y="175.43714285714287" width="53.14285714285714" height="104.56285714285714" rx="3" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/><text x="577.1428571428571" y="165.43714285714287" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="600" fill="#712B13">332.7</text><text x="577.1428571428571" y="294" text-anchor="middle" dominant-baseline="central" font-size="10" font-weight="400" fill="#444441">49,153번째</text><text x="577.1428571428571" y="310" text-anchor="middle" dominant-baseline="central" font-size="10" font-weight="400" fill="#888780">→ 131,072칸</text><rect x="639.1428571428571" y="86.90285714285716" width="53.14285714285714" height="193.09714285714284" rx="3" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/><text x="665.7142857142857" y="76.90285714285716" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="600" fill="#712B13">614.4</text><text x="665.7142857142857" y="294" text-anchor="middle" dominant-baseline="central" font-size="10" font-weight="400" fill="#444441">98,305번째</text><text x="665.7142857142857" y="310" text-anchor="middle" dominant-baseline="central" font-size="10" font-weight="400" fill="#888780">→ 262,144칸</text><text x="400.0" y="330" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="400" fill="#888780">확장이 일어난 SET (몇 번째 키 → 늘어난 칸 수)   * Python 3.13, 이 환경에서 1회 측정</text><rect x="30" y="360" width="700" height="28" rx="4" fill="#F1EFE8" stroke="#888780" stroke-width="0.6"/><text x="120" y="374" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#444441">병목</text><text x="340" y="374" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#444441">왜</text><text x="590" y="374" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#444441">개선</text><text x="120" y="403" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#444441">해시맵 확장</text><text x="340" y="403" text-anchor="middle" dominant-baseline="central" font-size="11.5" font-weight="400" fill="#993C1D">모든 키를 한 번에 다시 넣음 O(n)</text><text x="590" y="403" text-anchor="middle" dominant-baseline="central" font-size="11.5" font-weight="400" fill="#085041">조금씩 옮기기 (점진적 리해시)</text><text x="120" y="433" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#444441">KEYS</text><text x="340" y="433" text-anchor="middle" dominant-baseline="central" font-size="11.5" font-weight="400" fill="#993C1D">모든 칸을 훑음 (10만 건 ≈ 38ms)</text><text x="590" y="433" text-anchor="middle" dominant-baseline="central" font-size="11.5" font-weight="400" fill="#085041">SCAN처럼 나눠서 조회</text><text x="120" y="463" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#444441">TTL 힙의 낡은 항목</text><text x="340" y="463" text-anchor="middle" dominant-baseline="central" font-size="11.5" font-weight="400" fill="#993C1D">EXPIRE를 반복하면 힙만 커짐</text><text x="590" y="463" text-anchor="middle" dominant-baseline="central" font-size="11.5" font-weight="400" fill="#085041">낡은 비율이 크면 힙 다시 만들기</text><text x="120" y="493" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#444441">파이썬 객체 메모리</text><text x="340" y="493" text-anchor="middle" dominant-baseline="central" font-size="11.5" font-weight="400" fill="#993C1D">키마다 노드·Record·튜플 객체</text><text x="590" y="493" text-anchor="middle" dominant-baseline="central" font-size="11.5" font-weight="400" fill="#085041">__slots__, 배열 기반 노드</text><text x="120" y="523" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#444441">만료 확인 시점</text><text x="340" y="523" text-anchor="middle" dominant-baseline="central" font-size="11.5" font-weight="400" fill="#993C1D">명령이 올 때만 확인</text><text x="590" y="523" text-anchor="middle" dominant-baseline="central" font-size="11.5" font-weight="400" fill="#085041">주기적으로 일부 키 검사</text></svg>