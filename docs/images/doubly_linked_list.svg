<svg xmlns="http://www.w3.org/2000/svg" width="760" height="480" viewBox="0 0 760 480" font-family="-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" role="img" xml:space="preserve" style="white-space:pre"><title>이중 연결 리스트와 move_to_front</title><rect width="760" height="480" fill="#FFFFFF" rx="12"/><text x="30" y="30" text-anchor="start" dominant-baseline="central" font-size="14" font-weight="700" fill="#444441">노드 하나 = prev + data + next</text><rect x="330" y="12" width="270" height="40" rx="6" fill="#FFFFFF" stroke="#5F5E5A" stroke-width="0.8"/><line x1="410" y1="12" x2="410" y2="52" stroke="#5F5E5A" stroke-width="0.8"/><line x1="520" y1="12" x2="520" y2="52" stroke="#5F5E5A" stroke-width="0.8"/><text x="370" y="32" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#185FA5" font-family="'SF Mono', Menlo, Consolas, 'D2Coding', 'Noto Sans Mono CJK KR', monospace">prev</text><text x="465" y="32" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#444441" font-family="'SF Mono', Menlo, Consolas, 'D2Coding', 'Noto Sans Mono CJK KR', monospace">data</text><text x="560" y="32" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#0F6E56" font-family="'SF Mono', Menlo, Consolas, 'D2Coding', 'Noto Sans Mono CJK KR', monospace">next</text><text x="620" y="32" text-anchor="start" dominant-baseline="central" font-size="11" font-weight="400" fill="#888780">← 앞뒤를 모두 기억</text><text x="30" y="74" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#888780">위쪽 화살표 = next (뒤로),  아래쪽 화살표 = prev (앞으로)</text><rect x="60" y="128" width="92" height="50" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.8" stroke-dasharray="4 3"/><text x="106.0" y="143.0" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#444441">head</text><text x="106.0" y="164.0" text-anchor="middle" dominant-baseline="central" font-size="10" font-weight="400" fill="#888780">가짜 노드</text><rect x="200" y="128" width="92" height="50" rx="8" fill="#FFFFFF" stroke="#888780" stroke-width="0.8"/><text x="246.0" y="153.0" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#444441">A</text><rect x="340" y="128" width="92" height="50" rx="8" fill="#FFFFFF" stroke="#888780" stroke-width="0.8"/><text x="386.0" y="153.0" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#444441">B</text><rect x="480" y="128" width="92" height="50" rx="8" fill="#FFFFFF" stroke="#888780" stroke-width="0.8"/><text x="526.0" y="153.0" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#444441">C</text><rect x="620" y="128" width="92" height="50" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.8" stroke-dasharray="4 3"/><text x="666.0" y="143.0" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#444441">tail</text><text x="666.0" y="164.0" text-anchor="middle" dominant-baseline="central" font-size="10" font-weight="400" fill="#888780">가짜 노드</text><line x1="154" y1="145" x2="198" y2="145" stroke="#5F5E5A" stroke-width="1.3"/><path d="M189.6 151.0 L198.0 145.0 L189.6 139.0" fill="none" stroke="#5F5E5A" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round"/><line x1="198" y1="161" x2="154" y2="161" stroke="#5F5E5A" stroke-width="1.3"/><path d="M162.4 155.0 L154.0 161.0 L162.4 167.0" fill="none" stroke="#5F5E5A" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round"/><line x1="294" y1="145" x2="338" y2="145" stroke="#5F5E5A" stroke-width="1.3"/><path d="M329.6 151.0 L338.0 145.0 L329.6 139.0" fill="none" stroke="#5F5E5A" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round"/><line x1="338" y1="161" x2="294" y2="161" stroke="#5F5E5A" stroke-width="1.3"/><path d="M302.4 155.0 L294.0 161.0 L302.4 167.0" fill="none" stroke="#5F5E5A" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round"/><line x1="434" y1="145" x2="478" y2="145" stroke="#5F5E5A" stroke-width="1.3"/><path d="M469.6 151.0 L478.0 145.0 L469.6 139.0" fill="none" stroke="#5F5E5A" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round"/><line x1="478" y1="161" x2="434" y2="161" stroke="#5F5E5A" stroke-width="1.3"/><path d="M442.4 155.0 L434.0 161.0 L442.4 167.0" fill="none" stroke="#5F5E5A" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round"/><line x1="574" y1="145" x2="618" y2="145" stroke="#5F5E5A" stroke-width="1.3"/><path d="M609.6 151.0 L618.0 145.0 L609.6 139.0" fill="none" stroke="#5F5E5A" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round"/><line x1="618" y1="161" x2="574" y2="161" stroke="#5F5E5A" stroke-width="1.3"/><path d="M582.4 155.0 L574.0 161.0 L582.4 167.0" fill="none" stroke="#5F5E5A" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round"/><text x="30" y="112" text-anchor="start" dominant-baseline="central" font-size="13" font-weight="600" fill="#444441">① 처음:  앞(최근) ← A, B, C → 뒤(오래됨)</text><text x="30" y="214" text-anchor="start" dominant-baseline="central" font-size="13" font-weight="600" fill="#444441">② move_to_front(C): C를 떼고 → head 바로 뒤에 붙인다</text><text x="60" y="238" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#993C1D" font-family="'SF Mono', Menlo, Consolas, 'D2Coding', 'Noto Sans Mono CJK KR', monospace">떼기 (양옆끼리 연결):   B.next = tail,  tail.prev = B</text><text x="60" y="258" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#993C1D" font-family="'SF Mono', Menlo, Consolas, 'D2Coding', 'Noto Sans Mono CJK KR', monospace">붙이기 (head 뒤에):     C.prev = head,  C.next = A,  head.next = C,  A.prev = C</text><rect x="60" y="304" width="92" height="50" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.8" stroke-dasharray="4 3"/><text x="106.0" y="319.0" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#444441">head</text><text x="106.0" y="340.0" text-anchor="middle" dominant-baseline="central" font-size="10" font-weight="400" fill="#888780">가짜 노드</text><rect x="200" y="304" width="92" height="50" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.8"/><text x="246.0" y="329.0" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#633806">C</text><rect x="340" y="304" width="92" height="50" rx="8" fill="#FFFFFF" stroke="#888780" stroke-width="0.8"/><text x="386.0" y="329.0" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#444441">A</text><rect x="480" y="304" width="92" height="50" rx="8" fill="#FFFFFF" stroke="#888780" stroke-width="0.8"/><text x="526.0" y="329.0" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#444441">B</text><rect x="620" y="304" width="92" height="50" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.8" stroke-dasharray="4 3"/><text x="666.0" y="319.0" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#444441">tail</text><text x="666.0" y="340.0" text-anchor="middle" dominant-baseline="central" font-size="10" font-weight="400" fill="#888780">가짜 노드</text><line x1="154" y1="321" x2="198" y2="321" stroke="#993C1D" stroke-width="2.2"/><path d="M189.6 327.0 L198.0 321.0 L189.6 315.0" fill="none" stroke="#993C1D" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/><line x1="198" y1="337" x2="154" y2="337" stroke="#993C1D" stroke-width="2.2"/><path d="M162.4 331.0 L154.0 337.0 L162.4 343.0" fill="none" stroke="#993C1D" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/><line x1="294" y1="321" x2="338" y2="321" stroke="#993C1D" stroke-width="2.2"/><path d="M329.6 327.0 L338.0 321.0 L329.6 315.0" fill="none" stroke="#993C1D" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/><line x1="338" y1="337" x2="294" y2="337" stroke="#993C1D" stroke-width="2.2"/><path d="M302.4 331.0 L294.0 337.0 L302.4 343.0" fill="none" stroke="#993C1D" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/><line x1="434" y1="321" x2="478" y2="321" stroke="#5F5E5A" stroke-width="1.3"/><path d="M469.6 327.0 L478.0 321.0 L469.6 315.0" fill="none" stroke="#5F5E5A" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round"/><line x1="478" y1="337" x2="434" y2="337" stroke="#5F5E5A" stroke-width="1.3"/><path d="M442.4 331.0 L434.0 337.0 L442.4 343.0" fill="none" stroke="#5F5E5A" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round"/><line x1="574" y1="321" x2="618" y2="321" stroke="#993C1D" stroke-width="2.2"/><path d="M609.6 327.0 L618.0 321.0 L609.6 315.0" fill="none" stroke="#993C1D" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/><line x1="618" y1="337" x2="574" y2="337" stroke="#993C1D" stroke-width="2.2"/><path d="M582.4 331.0 L574.0 337.0 L582.4 343.0" fill="none" stroke="#993C1D" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/><text x="30" y="288" text-anchor="start" dominant-baseline="central" font-size="13" font-weight="600" fill="#444441">③ 결과:  빨간 연결선만 바뀌었다</text><rect x="30" y="380" width="700" height="82" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/><text x="50" y="402" text-anchor="start" dominant-baseline="central" font-size="13" font-weight="700" fill="#085041">왜 O(1)인가?</text><text x="50" y="424" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#085041">• 노드가 앞(prev)과 뒤(next)를 둘 다 알아서, 앞 노드를 찾으러 처음부터 걸어갈 필요가 없다.</text><text x="50" y="444" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#085041">• 리스트가 100개든 100만 개든 바꾸는 연결선 수는 항상 같다 (떼기 2개 + 붙이기 4개).</text></svg>