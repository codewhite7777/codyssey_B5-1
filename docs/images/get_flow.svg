<svg xmlns="http://www.w3.org/2000/svg" width="760" height="600" viewBox="0 0 760 600" font-family="-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" role="img" xml:space="preserve" style="white-space:pre"><title>GET 명령어 전체 흐름</title><rect width="760" height="600" fill="#FFFFFF" rx="12"/><rect x="140" y="20" width="220" height="44" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/><text x="250.0" y="42.0" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="600" fill="#3C3489" font-family="'SF Mono', Menlo, Consolas, 'D2Coding', 'Noto Sans Mono CJK KR', monospace">GET key</text><line x1="250" y1="64" x2="250" y2="88" stroke="#5F5E5A" stroke-width="1.3"/><path d="M244.0 79.6 L250.0 88.0 L256.0 79.6" fill="none" stroke="#5F5E5A" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round"/><rect x="100" y="90" width="300" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.8"/><text x="250.0" y="108.0" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#0C447C">① 힙 정리</text><text x="250.0" y="129.0" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="400" fill="#185FA5">만료 시각이 지난 키들을 먼저 삭제</text><line x1="250" y1="146" x2="250" y2="170" stroke="#5F5E5A" stroke-width="1.3"/><path d="M244.0 161.6 L250.0 170.0 L256.0 161.6" fill="none" stroke="#5F5E5A" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round"/><path d="M250 172.0 L370.0 214 L250 256.0 L130.0 214 Z" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.8"/><text x="250" y="206.5" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#633806">② 해시맵에</text><text x="250" y="221.5" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#633806">키가 있나?</text><line x1="370" y1="214" x2="470" y2="214" stroke="#5F5E5A" stroke-width="1.3"/><path d="M461.6 220.0 L470.0 214.0 L461.6 208.0" fill="none" stroke="#5F5E5A" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round"/><text x="420" y="202" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="400" fill="#888780">없음</text><rect x="472" y="190" width="180" height="48" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.8"/><text x="562.0" y="204.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#444441" font-family="'SF Mono', Menlo, Consolas, 'D2Coding', 'Noto Sans Mono CJK KR', monospace">(nil)</text><text x="562.0" y="225.0" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="400" fill="#888780">LRU 갱신 안 함</text><line x1="250" y1="256" x2="250" y2="282" stroke="#5F5E5A" stroke-width="1.3"/><path d="M244.0 273.6 L250.0 282.0 L256.0 273.6" fill="none" stroke="#5F5E5A" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round"/><text x="260" y="268" text-anchor="start" dominant-baseline="central" font-size="11" font-weight="400" fill="#888780">있음</text><path d="M250 284.0 L380.0 328 L250 372.0 L120.0 328 Z" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.8"/><text x="250" y="320.5" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#633806">③ 만료 시각이</text><text x="250" y="335.5" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#633806">지났나?</text><line x1="380" y1="328" x2="470" y2="328" stroke="#5F5E5A" stroke-width="1.3"/><path d="M461.6 334.0 L470.0 328.0 L461.6 322.0" fill="none" stroke="#5F5E5A" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round"/><text x="420" y="316" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="400" fill="#888780">지남</text><rect x="472" y="300" width="260" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/><text x="602.0" y="318.0" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#712B13">삭제 → (nil)</text><text x="602.0" y="339.0" text-anchor="middle" dominant-baseline="central" font-size="10" font-weight="400" fill="#993C1D">해시맵·리스트·used_memory에서 삭제, LRU 갱신 안 함</text><line x1="250" y1="372" x2="250" y2="398" stroke="#5F5E5A" stroke-width="1.3"/><path d="M244.0 389.6 L250.0 398.0 L256.0 389.6" fill="none" stroke="#5F5E5A" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round"/><text x="260" y="384" text-anchor="start" dominant-baseline="central" font-size="11" font-weight="400" fill="#888780">안 지남 / 만료 없음</text><rect x="100" y="400" width="300" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.8"/><text x="250.0" y="418.0" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#633806">④ LRU 갱신</text><text x="250.0" y="439.0" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="400" fill="#854F0B">move_to_front(record.lru_node)  O(1)</text><line x1="250" y1="456" x2="250" y2="480" stroke="#5F5E5A" stroke-width="1.3"/><path d="M244.0 471.6 L250.0 480.0 L256.0 471.6" fill="none" stroke="#5F5E5A" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round"/><rect x="140" y="482" width="220" height="48" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/><text x="250.0" y="506.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#085041">⑤ "value" 반환</text><text x="30" y="566" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#888780">규칙: 값을 실제로 돌려줄 때만 LRU를 갱신한다. 없는 키나 만료된 키는 '사용'이 아니므로 순서를 바꾸지 않는다.</text><rect x="472" y="400" width="260" height="130" rx="8" fill="#1F1F1D" stroke="#1F1F1D" stroke-width="0"/><text x="484" y="416" text-anchor="start" dominant-baseline="central" font-size="10.5" font-weight="400" fill="#D3D1C7" font-family="'SF Mono', Menlo, Consolas, 'D2Coding', 'Noto Sans Mono CJK KR', monospace">def get(self, key):</text><text x="484" y="432" text-anchor="start" dominant-baseline="central" font-size="10.5" font-weight="400" fill="#D3D1C7" font-family="'SF Mono', Menlo, Consolas, 'D2Coding', 'Noto Sans Mono CJK KR', monospace">    record = self._get_alive_record(key)</text><text x="484" y="448" text-anchor="start" dominant-baseline="central" font-size="10.5" font-weight="400" fill="#D3D1C7" font-family="'SF Mono', Menlo, Consolas, 'D2Coding', 'Noto Sans Mono CJK KR', monospace">    if record is None:</text><text x="484" y="464" text-anchor="start" dominant-baseline="central" font-size="10.5" font-weight="400" fill="#D3D1C7" font-family="'SF Mono', Menlo, Consolas, 'D2Coding', 'Noto Sans Mono CJK KR', monospace">        return None</text><text x="484" y="480" text-anchor="start" dominant-baseline="central" font-size="10.5" font-weight="400" fill="#D3D1C7" font-family="'SF Mono', Menlo, Consolas, 'D2Coding', 'Noto Sans Mono CJK KR', monospace">    self._lru.move_to_front(</text><text x="484" y="496" text-anchor="start" dominant-baseline="central" font-size="10.5" font-weight="400" fill="#D3D1C7" font-family="'SF Mono', Menlo, Consolas, 'D2Coding', 'Noto Sans Mono CJK KR', monospace">        record.lru_node)</text><text x="484" y="512" text-anchor="start" dominant-baseline="central" font-size="10.5" font-weight="400" fill="#D3D1C7" font-family="'SF Mono', Menlo, Consolas, 'D2Coding', 'Noto Sans Mono CJK KR', monospace">    return record.value</text></svg>