<svg xmlns="http://www.w3.org/2000/svg" width="760" height="740" viewBox="0 0 760 740" font-family="-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" role="img" xml:space="preserve" style="white-space:pre"><title>SET 명령어와 LRU 제거 흐름</title><rect width="760" height="740" fill="#FFFFFF" rx="12"/><rect x="140" y="20" width="220" height="44" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/><text x="250.0" y="42.0" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="600" fill="#3C3489" font-family="'SF Mono', Menlo, Consolas, 'D2Coding', 'Noto Sans Mono CJK KR', monospace">SET key value</text><line x1="250" y1="64" x2="250" y2="86" stroke="#5F5E5A" stroke-width="1.3"/><path d="M244.0 77.6 L250.0 86.0 L256.0 77.6" fill="none" stroke="#5F5E5A" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round"/><rect x="90" y="88" width="320" height="52" rx="8" fill="#FFFFFF" stroke="#888780" stroke-width="0.8"/><text x="250.0" y="114.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#444441">① size = len(utf8(key)) + len(utf8(value))</text><line x1="250" y1="140" x2="250" y2="164" stroke="#5F5E5A" stroke-width="1.3"/><path d="M244.0 155.6 L250.0 164.0 L256.0 155.6" fill="none" stroke="#5F5E5A" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round"/><path d="M250 166.0 L390.0 208 L250 250.0 L110.0 208 Z" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.8"/><text x="250" y="200.5" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#633806">② maxmemory &gt; 0 이고</text><text x="250" y="215.5" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#633806">size &gt; maxmemory?</text><line x1="390" y1="208" x2="470" y2="208" stroke="#5F5E5A" stroke-width="1.3"/><path d="M461.6 214.0 L470.0 208.0 L461.6 202.0" fill="none" stroke="#5F5E5A" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round"/><text x="430" y="196" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="400" fill="#888780">예</text><rect x="472" y="180" width="260" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/><text x="602.0" y="198.0" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#712B13" font-family="'SF Mono', Menlo, Consolas, 'D2Coding', 'Noto Sans Mono CJK KR', monospace">(error) OOM ...</text><text x="602.0" y="219.0" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="400" fill="#993C1D">저장하지 않음 (기존 값도 그대로)</text><line x1="250" y1="250" x2="250" y2="274" stroke="#5F5E5A" stroke-width="1.3"/><path d="M244.0 265.6 L250.0 274.0 L256.0 265.6" fill="none" stroke="#5F5E5A" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round"/><text x="260" y="262" text-anchor="start" dominant-baseline="central" font-size="11" font-weight="400" fill="#888780">아니오</text><path d="M250 274.0 L360.0 312 L250 350.0 L140.0 312 Z" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.8"/><text x="250" y="304.5" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#633806">③ 키가</text><text x="250" y="319.5" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#633806">이미 있나?</text><path d="M140 312 L100 312 L100 350" fill="none" stroke="#5F5E5A" stroke-width="1.3" stroke-linejoin="round"/><path d="M94.0 341.6 L100.0 350.0 L106.0 341.6" fill="none" stroke="#5F5E5A" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round"/><text x="130" y="300" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="400" fill="#888780">없음</text><path d="M360 312 L400 312 L400 350" fill="none" stroke="#5F5E5A" stroke-width="1.3" stroke-linejoin="round"/><path d="M394.0 341.6 L400.0 350.0 L406.0 341.6" fill="none" stroke="#5F5E5A" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round"/><text x="370" y="300" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="400" fill="#888780">있음</text><rect x="20" y="352" width="200" height="88" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/><text x="120" y="372" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="700" fill="#085041">새로 넣기</text><text x="120" y="394" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="400" fill="#0F6E56">리스트 맨 앞에 노드 추가</text><text x="120" y="412" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="400" fill="#0F6E56" font-family="'SF Mono', Menlo, Consolas, 'D2Coding', 'Noto Sans Mono CJK KR', monospace">해시맵.put(key, Record)</text><rect x="280" y="352" width="240" height="88" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.8"/><text x="400" y="372" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="700" fill="#633806">덮어쓰기</text><text x="400" y="392" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="400" fill="#854F0B">used_memory −= 예전 size</text><text x="400" y="410" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="400" fill="#854F0B">expire_at = None (TTL 초기화)</text><text x="400" y="428" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="400" fill="#854F0B">리스트 맨 앞으로 이동</text><path d="M120 440 L120 466 L230 466 L230 482" fill="none" stroke="#5F5E5A" stroke-width="1.3" stroke-linejoin="round"/><path d="M224.0 473.6 L230.0 482.0 L236.0 473.6" fill="none" stroke="#5F5E5A" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round"/><path d="M400 440 L400 466 L270 466 L270 482" fill="none" stroke="#5F5E5A" stroke-width="1.3" stroke-linejoin="round"/><path d="M264.0 473.6 L270.0 482.0 L276.0 473.6" fill="none" stroke="#5F5E5A" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round"/><rect x="120" y="484" width="260" height="44" rx="8" fill="#FFFFFF" stroke="#888780" stroke-width="0.8"/><text x="250.0" y="506.0" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#444441">④ used_memory += size</text><line x1="250" y1="528" x2="250" y2="552" stroke="#5F5E5A" stroke-width="1.3"/><path d="M244.0 543.6 L250.0 552.0 L256.0 543.6" fill="none" stroke="#5F5E5A" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round"/><path d="M250 554.0 L390.0 594 L250 634.0 L110.0 594 Z" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.8"/><text x="250" y="586.5" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#633806">⑤ used_memory</text><text x="250" y="601.5" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#633806">&gt; maxmemory?</text><line x1="390" y1="594" x2="470" y2="594" stroke="#5F5E5A" stroke-width="1.3"/><path d="M461.6 600.0 L470.0 594.0 L461.6 588.0" fill="none" stroke="#5F5E5A" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round"/><text x="430" y="582" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="400" fill="#888780">예</text><rect x="472" y="552" width="260" height="86" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/><text x="602" y="572" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="700" fill="#712B13">LRU 제거 (한 개)</text><text x="602" y="594" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="400" fill="#993C1D">리스트 맨 뒤 키를 _delete</text><text x="602" y="612" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="400" fill="#993C1D" font-family="'SF Mono', Menlo, Consolas, 'D2Coding', 'Noto Sans Mono CJK KR', monospace">evicted_keys += 1</text><path d="M602 638 L602 666 L746 666 L746 540 L290 540 L290 553" fill="none" stroke="#993C1D" stroke-width="1.3" stroke-linejoin="round"/><path d="M284.0 544.6 L290.0 553.0 L296.0 544.6" fill="none" stroke="#993C1D" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round"/><text x="612" y="680" text-anchor="start" dominant-baseline="central" font-size="11" font-weight="400" fill="#993C1D">지운 뒤 ⑤로 돌아가 다시 비교</text><line x1="250" y1="634" x2="250" y2="660" stroke="#5F5E5A" stroke-width="1.3"/><path d="M244.0 651.6 L250.0 660.0 L256.0 651.6" fill="none" stroke="#5F5E5A" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round"/><text x="260" y="646" text-anchor="start" dominant-baseline="central" font-size="11" font-weight="400" fill="#888780">아니오</text><rect x="190" y="662" width="120" height="40" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/><text x="250.0" y="682.0" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="600" fill="#085041" font-family="'SF Mono', Menlo, Consolas, 'D2Coding', 'Noto Sans Mono CJK KR', monospace">OK</text><text x="30" y="724" text-anchor="start" dominant-baseline="central" font-size="11" font-weight="400" fill="#888780">방금 넣은 키는 맨 앞에 있고 크기 ≤ maxmemory라서, 반복은 그 키에 닿기 전에 멈춘다.</text></svg>