>10초</text><text x="440" y="279" text-anchor="middle" dominant-baseline="central" font-size="10" font-weight="400" fill="#888780" font-family="'SF Mono', Menlo, Consolas, 'D2Coding', 'Noto Sans Mono CJK KR', monospace">a</text><text x="470" y="248" text-anchor="start" dominant-baseline="central" font-size="10" font-weight="400" fill="#888780" font-family="'SF Mono', Menlo, Consolas, 'D2Coding', 'Noto Sans Mono CJK KR', monospace">[3]</text><circle cx="520" cy="270" r="26" fill="#FFFFFF" stroke="#888780" stroke-width="1"/><text x="520" y="263" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="700" fill="#444441">8초</text><text x="520" y="279" text-anchor="middle" dominant-baseline="central" font-size="10" font-weight="400" fill="#888780" font-family="'SF Mono', Menlo, Consolas, 'D2Coding', 'Noto Sans Mono CJK KR', monospace">d</text><text x="550" y="248" text-anchor="start" dominant-baseline="central" font-size="10" font-weight="400" fill="#888780" font-family="'SF Mono', Menlo, Consolas, 'D2Coding', 'Noto Sans Mono CJK KR', monospace">[4]</text><text x="30" y="330" text-anchor="start" dominant-baseline="central" font-size="13" font-weight="600" fill="#444441">실제로는 트리가 아니라 배열 하나에 저장한다</text><rect x="60" y="348" width="110" height="46" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.8"/><text x="115.0" y="371.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#0C447C" font-family="'SF Mono', Menlo, Consolas, 'D2Coding', 'Noto Sans Mono CJK KR', monospace">(3초, user:2)</text><text x="115" y="408" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="400" fill="#888780" font-family="'SF Mono', Menlo, Consolas, 'D2Coding', 'Noto Sans Mono CJK KR', monospace">[0]</text><rect x="180" y="348" width="110" height="46" rx="8" fill="#FFFFFF" stroke="#888780" stroke-width="0.8"/><text x="235.0" y="371.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#444441" font-family="'SF Mono', Menlo, Consolas, 'D2Coding', 'Noto Sans Mono CJK KR', monospace">(5초, b)</text><text x="235" y="408" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="400" fill="#888780" font-family="'SF Mono', Menlo, Consolas, 'D2Coding', 'Noto Sans Mono CJK KR', monospace">[1]</text><rect x="300" y="348" width="110" height="46" rx="8" fill="#FFFFFF" stroke="#888780" stroke-width="0.8"/><text x="355.0" y="371.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#444441" font-family="'SF Mono', Menlo, Consolas, 'D2Coding', 'Noto Sans Mono CJK KR', monospace">(20초, c)</text><text x="355" y="408" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="400" fill="#888780" font-family="'SF Mono', Menlo, Consolas, 'D2Coding', 'Noto Sans Mono CJK KR', monospace">[2]</text><rect x="420" y="348" width="110" height="46" rx="8" fill="#FFFFFF" stroke="#888780" stroke-width="0.8"/><text x="475.0" y="371.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#444441" font-family="'SF Mono', Menlo, Consolas, 'D2Coding', 'Noto Sans Mono CJK KR', monospace">(10초, a)</text><text x="475" y="408" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="400" fill="#888780" font-family="'SF Mono', Menlo, Consolas, 'D2Coding', 'Noto Sans Mono CJK KR', monospace">[3]</text><rect x="540" y="348" width="110" height="46" rx="8" fill="#FFFFFF" stroke="#888780" stroke-width="0.8"/><text x="595.0" y="371.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#444441" font-family="'SF Mono', Menlo, Consolas, 'D2Coding', 'Noto Sans Mono CJK KR', monospace">(8초, d)</text><text x="595" y="408" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="400" fill="#888780" font-family="'SF Mono', Menlo, Consolas, 'D2Coding', 'Noto Sans Mono CJK KR', monospace">[4]</text><text x="660" y="371" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="600" fill="#185FA5">← 0번 = peek</text><text x="30" y="434" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#444441" font-family="'SF Mono', Menlo, Consolas, 'D2Coding', 'Noto Sans Mono CJK KR', monospace">부모 = (i − 1) // 2      왼쪽 자식 = 2i + 1      오른쪽 자식 = 2i + 2</text><rect x="30" y="460" width="700" height="30" rx="4" fill="#F1EFE8" stroke="#888780" stroke-width="0.6"/><text x="170" y="475" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#444441">방법</text><text x="390" y="475" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#444441">가장 빠른 만료 찾기</text><text x="600" y="475" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#444441">새 만료 넣기</text><text x="170" y="504" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#444441">그냥 리스트</text><text x="390" y="504" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#993C1D">O(n) 전부 비교</text><text x="600" y="504" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#444441">O(1)</text><text x="170" y="532" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#444441">최소 힙</text><text x="390" y="532" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#085041">O(1) 맨 위 보기</text><text x="600" y="532" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#085041">O(log n) 위로 올리기</text></svg>