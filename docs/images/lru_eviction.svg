<svg xmlns="http://www.w3.org/2000/svg" width="760" height="590" viewBox="0 0 760 590" font-family="-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" role="img" xml:space="preserve" style="white-space:pre"><title>maxmemory 30에서 LRU 제거 과정</title><rect width="760" height="590" fill="#FFFFFF" rx="12"/><text x="30" y="28" text-anchor="start" dominant-baseline="central" font-size="15" font-weight="700" fill="#444441">CONFIG SET maxmemory 30 다음에 SET 3번</text><text x="370" y="28" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#888780">크기 = 키 바이트 + 값 바이트</text><rect x="30" y="52" width="700" height="108" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.8"/><text x="46" y="72" text-anchor="start" dominant-baseline="central" font-size="13" font-weight="700" fill="#444441" font-family="'SF Mono', Menlo, Consolas, 'D2Coding', 'Noto Sans Mono CJK KR', monospace">①  SET user:1 "Alice"</text><text x="46" y="94" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#888780">크기 6 + 5 = 11</text><text x="46" y="126" text-anchor="start" dominant-baseline="central" font-size="11" font-weight="400" fill="#888780">앞</text><rect x="70" y="110" width="86" height="32" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.8"/><text x="113.0" y="126.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#633806" font-family="'SF Mono', Menlo, Consolas, 'D2Coding', 'Noto Sans Mono CJK KR', monospace">user:1</text><text x="162" y="126" text-anchor="start" dominant-baseline="central" font-size="11" font-weight="400" fill="#888780">뒤</text><text x="450" y="94" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="600" fill="#444441">used_memory 11 / 30</text><rect x="450" y="112" width="250" height="18" rx="4" fill="#F1EFE8" stroke="#888780" stroke-width="0.6"/><rect x="450" y="112" width="91.66666666666666" height="18" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.6"/><rect x="30" y="172" width="700" height="108" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.8"/><text x="46" y="192" text-anchor="start" dominant-baseline="central" font-size="13" font-weight="700" fill="#444441" font-family="'SF Mono', Menlo, Consolas, 'D2Coding', 'Noto Sans Mono CJK KR', monospace">②  SET user:2 "Bob"</text><text x="46" y="214" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#888780">크기 6 + 3 = 9</text><text x="46" y="246" text-anchor="start" dominant-baseline="central" font-size="11" font-weight="400" fill="#888780">앞</text><rect x="70" y="230" width="86" height="32" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.8"/><text x="113.0" y="246.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#633806" font-family="'SF Mono', Menlo, Consolas, 'D2Coding', 'Noto Sans Mono CJK KR', monospace">user:2</text><rect x="166" y="230" width="86" height="32" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.8"/><text x="209.0" y="246.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#633806" font-family="'SF Mono', Menlo, Consolas, 'D2Coding', 'Noto Sans Mono CJK KR', monospace">user:1</text><text x="258" y="246" text-anchor="start" dominant-baseline="central" font-size="11" font-weight="400" fill="#888780">뒤</text><text x="450" y="214" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="600" fill="#444441">used_memory 20 / 30</text><rect x="450" y="232" width="250" height="18" rx="4" fill="#F1EFE8" stroke="#888780" stroke-width="0.6"/><rect x="450" y="232" width="166.66666666666666" height="18" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.6"/><rect x="30" y="292" width="700" height="222" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.8"/><text x="46" y="312" text-anchor="start" dominant-baseline="central" font-size="13" font-weight="700" fill="#444441" font-family="'SF Mono', Menlo, Consolas, 'D2Coding', 'Noto Sans Mono CJK KR', monospace">③  SET user:3 "Charlie"</text><text x="46" y="334" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#888780">크기 6 + 7 = 13</text><text x="46" y="366" text-anchor="start" dominant-baseline="central" font-size="11" font-weight="400" fill="#888780">앞</text><rect x="70" y="350" width="86" height="32" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.8"/><text x="113.0" y="366.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#633806" font-family="'SF Mono', Menlo, Consolas, 'D2Coding', 'Noto Sans Mono CJK KR', monospace">user:3</text><rect x="166" y="350" width="86" height="32" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.8"/><text x="209.0" y="366.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#633806" font-family="'SF Mono', Menlo, Consolas, 'D2Coding', 'Noto Sans Mono CJK KR', monospace">user:2</text><rect x="262" y="350" width="86" height="32" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/><text x="305.0" y="366.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#712B13" font-family="'SF Mono', Menlo, Consolas, 'D2Coding', 'Noto Sans Mono CJK KR', monospace">user:1</text><text x="354" y="366" text-anchor="start" dominant-baseline="central" font-size="11" font-weight="400" fill="#888780">뒤</text><text x="450" y="334" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="600" fill="#993C1D">used_memory 33 / 30</text><rect x="450" y="352" width="250" height="18" rx="4" fill="#F1EFE8" stroke="#888780" stroke-width="0.6"/><rect x="450" y="352" width="250.0" height="18" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="0.6"/><text x="700" y="384" text-anchor="end" dominant-baseline="central" font-size="11" font-weight="600" fill="#993C1D">30을 3바이트 초과</text><line x1="46" y1="396" x2="714" y2="396" stroke="#E5E3DC" stroke-width="1"/><text x="46" y="418" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="600" fill="#712B13">33 &gt; 30 이므로 30 이하가 될 때까지 반복:</text><text x="66" y="442" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#712B13">1) 리스트 맨 뒤 = user:1 (가장 오래 안 씀) 을 삭제 → 해시맵, 리스트, used_memory 모두에서</text><text x="66" y="466" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#712B13" font-family="'SF Mono', Menlo, Consolas, 'D2Coding', 'Noto Sans Mono CJK KR', monospace">2) used_memory 33 − 11 = 22 ,  evicted_keys 0 → 1</text><text x="66" y="490" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#712B13">3) 22 ≤ 30 → 멈춤</text><rect x="30" y="530" width="700" height="52" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/><text x="380" y="546" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="700" fill="#085041" font-family="'SF Mono', Menlo, Consolas, 'D2Coding', 'Noto Sans Mono CJK KR', monospace">INFO memory  →  used_memory:22   maxmemory:30   evicted_keys:1</text><text x="380" y="566" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#0F6E56" font-family="'SF Mono', Menlo, Consolas, 'D2Coding', 'Noto Sans Mono CJK KR', monospace">GET user:1 → (nil)</text></svg>