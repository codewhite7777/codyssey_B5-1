<svg xmlns="http://www.w3.org/2000/svg" width="760" height="520" viewBox="0 0 760 520" font-family="-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" role="img" xml:space="preserve" style="white-space:pre"><title>LFU로 바꾼다면: 빈도별 리스트</title><rect width="760" height="520" fill="#FFFFFF" rx="12"/><text x="30" y="28" text-anchor="start" dominant-baseline="central" font-size="14" font-weight="700" fill="#444441">LFU = 가장 '적게' 쓴 키부터 지운다.  필요한 것: 키마다 사용 횟수 + 횟수별 리스트</text><rect x="30" y="56" width="250" height="250" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/><text x="155" y="78" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="700" fill="#085041">HashMap  키 → Record</text><rect x="46" y="96" width="218" height="32" rx="6" fill="#FFFFFF" stroke="#0F6E56" stroke-width="0.6"/><text x="60" y="112" text-anchor="start" dominant-baseline="central" font-size="13" font-weight="700" fill="#085041" font-family="'SF Mono', Menlo, Consolas, 'D2Coding', 'Noto Sans Mono CJK KR', monospace">a</text><text x="90" y="112" text-anchor="start" dominant-baseline="central" font-size="11" font-weight="400" fill="#888780" font-family="'SF Mono', Menlo, Consolas, 'D2Coding', 'Noto Sans Mono CJK KR', monospace">freq=3  node ●</text><rect x="46" y="136" width="218" height="32" rx="6" fill="#FFFFFF" stroke="#0F6E56" stroke-width="0.6"/><text x="60" y="152" text-anchor="start" dominant-baseline="central" font-size="13" font-weight="700" fill="#085041" font-family="'SF Mono', Menlo, Consolas, 'D2Coding', 'Noto Sans Mono CJK KR', monospace">b</text><text x="90" y="152" text-anchor="start" dominant-baseline="central" font-size="11" font-weight="400" fill="#888780" font-family="'SF Mono', Menlo, Consolas, 'D2Coding', 'Noto Sans Mono CJK KR', monospace">freq=1  node ●</text><rect x="46" y="176" width="218" height="32" rx="6" fill="#FFFFFF" stroke="#0F6E56" stroke-width="0.6"/><text x="60" y="192" text-anchor="start" dominant-baseline="central" font-size="13" font-weight="700" fill="#085041" font-family="'SF Mono', Menlo, Consolas, 'D2Coding', 'Noto Sans Mono CJK KR', monospace">c</text><text x="90" y="192" text-anchor="start" dominant-baseline="central" font-size="11" font-weight="400" fill="#888780" font-family="'SF Mono', Menlo, Consolas, 'D2Coding', 'Noto Sans Mono CJK KR', monospace">freq=1  node ●</text><rect x="46" y="216" width="218" height="32" rx="6" fill="#FFFFFF" stroke="#0F6E56" stroke-width="0.6"/><text x="60" y="232" text-anchor="start" dominant-baseline="central" font-size="13" font-weight="700" fill="#085041" font-family="'SF Mono', Menlo, Consolas, 'D2Coding', 'Noto Sans Mono CJK KR', monospace">d</text><text x="90" y="232" text-anchor="start" dominant-baseline="central" font-size="11" font-weight="400" fill="#888780" font-family="'SF Mono', Menlo, Consolas, 'D2Coding', 'Noto Sans Mono CJK KR', monospace">freq=3  node ●</text><rect x="46" y="256" width="218" height="32" rx="6" fill="#FFFFFF" stroke="#0F6E56" stroke-width="0.6"/><text x="60" y="272" text-anchor="start" dominant-baseline="central" font-size="13" font-weight="700" fill="#085041" font-family="'SF Mono', Menlo, Consolas, 'D2Coding', 'Noto Sans Mono CJK KR', monospace">e</text><text x="90" y="272" text-anchor="start" dominant-baseline="central" font-size="11" font-weight="400" fill="#888780" font-family="'SF Mono', Menlo, Consolas, 'D2Coding', 'Noto Sans Mono CJK KR', monospace">freq=7  node ●</text><text x="155" y="296" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="600" fill="#993C1D">+ 새로 추가: freq (사용 횟수)</text><rect x="320" y="56" width="410" height="250" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.8"/><text x="525" y="78" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="700" fill="#633806">HashMap  freq → 이중 연결 리스트  (새로 추가)</text><rect x="336" y="100" width="70" height="44" rx="6" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/><text x="371" y="122" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="700" fill="#712B13">freq 1</text><line x1="406" y1="122" x2="428" y2="122" stroke="#5F5E5A" stroke-width="1.3"/><path d="M419.6 128.0 L428.0 122.0 L419.6 116.0" fill="none" stroke="#5F5E5A" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round"/><rect x="430" y="106" width="54" height="32" rx="8" fill="#FFFFFF" stroke="#888780" stroke-width="0.8"/><text x="457.0" y="122.0" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#444441" font-family="'SF Mono', Menlo, Consolas, 'D2Coding', 'Noto Sans Mono CJK KR', monospace">c</text><line x1="484" y1="116" x2="514" y2="116" stroke="#5F5E5A" stroke-width="1.3"/><path d="M505.6 122.0 L514.0 116.0 L505.6 110.0" fill="none" stroke="#5F5E5A" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round"/><line x1="514" y1="128" x2="484" y2="128" stroke="#5F5E5A" stroke-width="1.3"/><path d="M492.4 122.0 L484.0 128.0 L492.4 134.0" fill="none" stroke="#5F5E5A" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round"/><rect x="514" y="106" width="54" height="32" rx="8" fill="#FFFFFF" stroke="#888780" stroke-width="0.8"/><text x="541.0" y="122.0" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#444441" font-family="'SF Mono', Menlo, Consolas, 'D2Coding', 'Noto Sans Mono CJK KR', monospace">b</text><text x="602" y="114" text-anchor="start" dominant-baseline="central" font-size="11" font-weight="600" fill="#993C1D">← 뒤(b) = freq 1 중</text><text x="602" y="130" text-anchor="start" dominant-baseline="central" font-size="11" font-weight="600" fill="#993C1D">    가장 오래됨 → 먼저 제거</text><rect x="336" y="164" width="70" height="44" rx="6" fill="#FFFFFF" stroke="#854F0B" stroke-width="0.6"/><text x="371" y="186" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="700" fill="#633806">freq 3</text><line x1="406" y1="186" x2="428" y2="186" stroke="#5F5E5A" stroke-width="1.3"/><path d="M419.6 192.0 L428.0 186.0 L419.6 180.0" fill="none" stroke="#5F5E5A" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round"/><rect x="430" y="170" width="54" height="32" rx="8" fill="#FFFFFF" stroke="#888780" stroke-width="0.8"/><text x="457.0" y="186.0" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#444441" font-family="'SF Mono', Menlo, Consolas, 'D2Coding', 'Noto Sans Mono CJK KR', monospace">d</text><line x1="484" y1="180" x2="514" y2="180" stroke="#5F5E5A" stroke-width="1.3"/><path d="M505.6 186.0 L514.0 180.0 L505.6 174.0" fill="none" stroke="#5F5E5A" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round"/><line x1="514" y1="192" x2="484" y2="192" stroke="#5F5E5A" stroke-width="1.3"/><path d="M492.4 186.0 L484.0 192.0 L492.4 198.0" fill="none" stroke="#5F5E5A" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round"/><rect x="514" y="170" width="54" height="32" rx="8" fill="#FFFFFF" stroke="#888780" stroke-width="0.8"/><text x="541.0" y="186.0" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#444441" font-family="'SF Mono', Menlo, Consolas, 'D2Coding', 'Noto Sans Mono CJK KR', monospace">a</text><rect x="336" y="228" width="70" height="44" rx="6" fill="#FFFFFF" stroke="#854F0B" stroke-width="0.6"/><text x="371" y="250" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="700" fill="#633806">freq 7</text><line x1="406" y1="250" x2="428" y2="250" stroke="#5F5E5A" stroke-width="1.3"/><path d="M419.6 256.0 L428.0 250.0 L419.6 244.0" fill="none" stroke="#5F5E5A" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round"/><rect x="430" y="234" width="54" height="32" rx="8" fill="#FFFFFF" stroke="#888780" stroke-width="0.8"/><text x="457.0" y="250.0" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#444441" font-family="'SF Mono', Menlo, Consolas, 'D2Coding', 'Noto Sans Mono CJK KR', monospace">e</text><text x="525" y="296" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#993C1D">min_freq = 1  (지금 가장 작은 횟수, 새로 추가)</text><rect x="30" y="330" width="700" height="28" rx="4" fill="#F1EFE8" stroke="#888780" stroke-width="0.6"/><text x="140" y="344" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#444441">동작</text><text x="330" y="344" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#444441">LRU (지금)</text><text x="580" y="344" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#444441">LFU (바꾸면)</text><text x="140" y="372" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#444441">GET / SET 성공</text><text x="330" y="372" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#888780">노드를 맨 앞으로</text><text x="580" y="372" text-anchor="middle" dominant-baseline="central" font-size="11.5" font-weight="400" fill="#633806">freq f 리스트에서 빼서 f+1 리스트 앞으로, freq += 1</text><text x="140" y="400" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#444441">새 키</text><text x="330" y="400" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#888780">리스트 맨 앞</text><text x="580" y="400" text-anchor="middle" dominant-baseline="central" font-size="11.5" font-weight="400" fill="#633806">freq 1 리스트 앞, min_freq = 1</text><text x="140" y="428" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#444441">제거할 키 찾기</text><text x="330" y="428" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#888780">리스트 맨 뒤</text><text x="580" y="428" text-anchor="middle" dominant-baseline="central" font-size="11.5" font-weight="400" fill="#633806">min_freq 리스트의 맨 뒤 (동점이면 오래된 것)</text><text x="140" y="456" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#444441">min_freq 갱신</text><text x="330" y="456" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#888780">없음</text><text x="580" y="456" text-anchor="middle" dominant-baseline="central" font-size="11.5" font-weight="400" fill="#633806">f 리스트가 비었고 f == min_freq면 min_freq += 1</text><text x="140" y="484" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#444441">시간 복잡도</text><text x="330" y="484" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#888780">O(1)</text><text x="580" y="484" text-anchor="middle" dominant-baseline="central" font-size="11.5" font-weight="400" fill="#633806">O(1) 유지 (리스트를 횟수별로 여러 개 둬서)</text></svg>